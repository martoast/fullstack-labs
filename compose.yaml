name: fullstack-labs

services:
    fullstack-labs:
        build:
            context: .
            dockerfile: Dockerfile
        image: 'fullstack-labs/app'
        container_name: fullstack-labs
        ports:
            - '3003:3000'
        # SMTP credentials for the webinar registration endpoint. Injected at
        # run time, never baked into the image (.env is in .dockerignore).
        # The file is gitignored, so deploy.sh's `git reset --hard` leaves it
        # alone — but it also means a fresh clone must recreate it.
        env_file:
            - .env
        environment:
            NITRO_PORT: 3000
            NITRO_HOST: 0.0.0.0
        networks:
            - shared
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 30s

networks:
    shared:
        external: true
