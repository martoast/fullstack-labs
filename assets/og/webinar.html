<!doctype html>
<!--
  Source for the /webinar share card (public/img/og-webinar-N.jpg).
  Rendered at 1200x630 — see assets/og/render.sh webinar <version>.

  DESIGNED FOR THE THUMBNAIL, NOT THE FULL SIZE. WhatsApp and iMessage render
  this around 300px wide on a phone — roughly a 4x downscale — so anything
  under ~30px here becomes illegible. That is why there is no paragraph, no
  URL line and no small print: only a headline, one line of when, and a face.
  Check any change by downscaling to 320px before shipping it.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }

  body {
    position: relative;
    background: #1A1E24;
    font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: #fff;
    display: flex;
    align-items: center;
  }

  .glow-a, .glow-b { position: absolute; border-radius: 9999px; filter: blur(120px); }
  .glow-a { top: -200px; left: -140px; width: 640px; height: 640px; background: rgba(130,152,176,0.30); }
  .glow-b { bottom: -240px; right: 120px; width: 620px; height: 620px; background: rgba(70,188,255,0.18); }

  .content { position: relative; padding: 0 0 0 72px; width: 800px; }

  .logo { height: 40px; width: auto; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-top: 34px;
    padding: 12px 26px;
    border: 2px solid rgba(130,176,152,0.55);
    background: rgba(130,176,152,0.16);
    border-radius: 999px;
    font-size: 27px;
    font-weight: 700;
    color: #9BCB9F;
  }
  .dot { width: 13px; height: 13px; border-radius: 999px; background: #82B098; }

  h1 {
    margin-top: 30px;
    /* Sized so each line stays unbroken at this width — re-check on edit. */
    font-size: 66px;
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1.09;
    white-space: nowrap;
  }
  h1 .accent { color: #75c8ff; }

  .when {
    margin-top: 38px;
    display: inline-block;
    font-size: 34px;
    font-weight: 700;
    color: #fff;
    background: rgba(255,255,255,0.10);
    border: 2px solid rgba(255,255,255,0.20);
    border-radius: 14px;
    padding: 14px 28px;
  }

  /* A face reads even at thumbnail size — the name next to it does not, so
     there is no name. */
  .portrait {
    position: absolute;
    right: 70px;
    bottom: 78px;
    width: 224px;
    height: 224px;
    border-radius: 999px;
    object-fit: cover;
    object-position: 50% 12%;
    border: 4px solid rgba(255,255,255,0.28);
  }
</style>
</head>

<body>
  <div class="glow-a"></div>
  <div class="glow-b"></div>

  <img class="portrait" src="../../public/img/alex-1.webp" alt="">

  <div class="content">
    <img class="logo" src="../../public/logo.svg" alt="Fullstack Labs">
    <div class="badge"><span class="dot"></span> Webinar gratis · En vivo</div>
    <h1>Te enseño a usar la IA<br><span class="accent">en tu negocio.</span></h1>
    <div class="when">Miércoles · 10:00 AM</div>
  </div>
</body>
</html>
